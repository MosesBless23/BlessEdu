<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact | BlessEdu</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

  <style>
    body, html {
      margin: 0;
      padding: 0;
    }

    .contact-bg {
      background: url('pictures/gl.jpeg') no-repeat center center;
      background-size: cover;
      color: white;
      padding: 80px 0;
      position: relative;
    }

    .contact-overlay {
      background: rgba(0, 0, 0, 0.6);
      padding: 60px;
      border-radius: 10px;
    }

    .contact-info a {
      color: #0dcaf0;
      text-decoration: none;
    }

    .contact-info a:hover {
      color: #0d6efd;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">BlessEdu</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="courses.html">Courses</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contact Section -->
  <section class="contact-bg">
    <div class="container">
      <div class="contact-overlay text-white">
        <h2 class="text-center mb-4">Get in Touch with BlessEdu</h2>
        <div class="row">
          <div class="col-md-6 contact-info">
            <h4>Contact Information</h4>
            <ul class="list-unstyled">
              <li><strong>Email:</strong> <a href="mailto:mosesmendyofficial@gmail.com">mosesmendyofficial@gmail.com</a></li>
              <li><strong>Phone:</strong> <a href="tel:+2205939054">+220 5939054</a></li>
              <li>
                <strong>WhatsApp:</strong>
                <a href="https://wa.me/2205939054" target="_blank">
                  <i class="fab fa-whatsapp"></i> Chat on WhatsApp
                </a>
              </li>
            </ul>
          </div>
          <div class="col-md-6">
            <h4>Send Us a Message</h4>
            <form>
              <div class="mb-3">
                <label for="name" class="form-label">Your Name</label>
                <input type="text" class="form-control" id="name" placeholder="Enter your name" required />
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Your Email</label>
                <input type="email" class="form-control" id="email" placeholder="Enter your email" required />
              </div>
              <div class="mb-3">
                <label for="message" class="form-label">Your Message</label>
                <textarea class="form-control" id="message" rows="4" placeholder="Type your message..." required></textarea>
              </div>
              <button type="submit" class="btn btn-primary">Send Message</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
